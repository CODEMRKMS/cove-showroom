name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cove
          POSTGRES_PASSWORD: cove
          POSTGRES_DB: cove_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cove -d cove_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cove:cove@localhost:5432/cove_test
      DATABASE_URL_TEST: postgresql://cove:cove@localhost:5432/cove_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
      - run: npm run build
      # Production dependencies only; fail on high or critical.
      - run: npm audit --omit=dev --audit-level=high
